<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dimensional Inspection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="style.css">

  <!-- OpenCV -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js"
          onload="onOpenCvReady();"></script>
</head>
<body>

<div class="app">
  <h1>Visual Dimensional Inspection</h1>

  <div id="status">Loading OpenCV…</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button id="captureMaster" disabled>Capture Master</button>
    <button id="captureProduct" disabled>Capture Product</button>
  </div>

  <div class="slider">
    <label>Tolerance: <span id="tolVal">5</span>%</label>
    <input type="range" min="0" max="10" value="5" id="tolerance">
  </div>

  <div id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
