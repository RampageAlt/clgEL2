<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dimensional Inspection</title>

  <!-- OpenCV -->
  <script src="https://docs.opencv.org/4.x/opencv.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h2>Dimensional Inspection</h2>
  <p class="subtitle">Coin-referenced perimeter measurement</p>

  <img id="preview" class="hidden"/>

  <div class="slider-group">
    <label>
      Tolerance: <span id="tolValue">5</span>%
    </label>
    <input type="range" id="tolerance" min="0" max="10" value="5">
  </div>

  <div class="buttons">
    <input type="file" accept="image/*" capture="environment"
           id="masterInput" class="hidden">
    <input type="file" accept="image/*" capture="environment"
           id="productInput" class="hidden">

    <button id="masterBtn">Capture MASTER</button>
    <button id="productBtn" disabled>Capture PRODUCT</button>
  </div>

  <p id="status" class="status">Ready. Capture MASTER sample.</p>
</div>

<script src="script.js"></script>
</body>
</html>
